<title>Spatial AI Companion — Functional 3D Demo</title>

<body>
<canvas id="gl"></canvas>
<div id="ui">
<header class="card"><div><div class="eyebrow">SPATIAL AI COMPANION</div><div class="title">Functional WebGL 3D prototype</div></div><div class="pills"><span id="render-pill" class="pill">starting</span><span id="mode-pill" class="pill ok">Demo AI</span></div></header>

<div id="toast"></div></div>
<script>
