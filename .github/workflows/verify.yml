name: Verify Spatial AI Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Syntax checks
        run: npm run check

      - name: Deterministic mobile end-to-end verification
        run: npm run test:e2e

      - name: Transient AI reconnect regression
        run: npm run test:reconnect

      - name: OpenRouter OAuth PKCE smoke
        run: npm run test:oauth

      - name: Compound AI tool execution smoke
        run: npm run test:compound

      - name: Real AI backend mobile smoke
        run: npm run test:real

      - name: Immutable public URL mobile smoke
        run: npm run test:public
